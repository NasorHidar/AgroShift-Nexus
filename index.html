<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroShift Nexus — Climate-Resilient Crop Rotation</title>
    <meta name="description" content="A multi-agent decision-support platform that pairs NASA Earthdata with farmer knowledge to recommend climate-resilient crop rotations." />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#E8F5E9",
                100: "#DCFCE7",
                200: "#BBF7D0",
                300: "#86EFAC",
                400: "#4ADE80",
                500: "#22C55E",
                600: "#16A34A",
                700: "#15803D",
                800: "#166534",
                900: "#14532D",
              },
              ink: {
                900: "#1E293B",
                700: "#334155",
                600: "#475569",
                500: "#64748B",
                400: "#94A3B8",
                300: "#CBD5E1",
                200: "#E2E8F0",
                100: "#F1F5F9",
                50:  "#F8FAFC",
              },
              alert: {
                50:  "#FEF2F2",
                100: "#FEE2E2",
                500: "#EF4444",
                600: "#DC2626",
                700: "#B91C1C",
              },
              warn: {
                50: "#FFFBEB",
                500: "#F59E0B",
                600: "#D97706",
              },
              soil: {
                50:  "#FAF7F2",
                100: "#EFEAE0",
                200: "#D9CFB9",
                400: "#A89368",
                600: "#7C6843",
                800: "#4A3D26",
              },
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "Segoe UI", "Roboto", "sans-serif"],
              display: ["'Plus Jakarta Sans'", "Inter", "ui-sans-serif", "system-ui"],
            },
            boxShadow: {
              card: "0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.08)",
              cardHover: "0 4px 12px rgba(22,163,74,0.10), 0 24px 48px -16px rgba(15,23,42,0.12)",
              glow: "0 0 0 4px rgba(34,197,94,0.18)",
            },
            keyframes: {
              floaty: { "0%,100%": { transform: "translateY(0)" }, "50%": { transform: "translateY(-6px)" } },
              scan: { "0%": { transform: "translateX(-100%)" }, "100%": { transform: "translateX(100%)" } },
              pulseDot: { "0%,100%": { opacity: 0.4, transform: "scale(0.9)" }, "50%": { opacity: 1, transform: "scale(1.1)" } },
              ringPulse: { "0%": { transform: "scale(0.6)", opacity: 0.7 }, "100%": { transform: "scale(2.2)", opacity: 0 } },
              fadeUp: { "0%": { opacity: 0, transform: "translateY(10px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
              shimmer: { "0%": { backgroundPosition: "-200% 0" }, "100%": { backgroundPosition: "200% 0" } },
              orbit: { "0%": { transform: "rotate(0deg)" }, "100%": { transform: "rotate(360deg)" } },
            },
            animation: {
              floaty: "floaty 4s ease-in-out infinite",
              scan: "scan 2.4s linear infinite",
              pulseDot: "pulseDot 1.4s ease-in-out infinite",
              ringPulse: "ringPulse 1.8s ease-out infinite",
              fadeUp: "fadeUp 0.5s ease-out both",
              shimmer: "shimmer 3s linear infinite",
              orbit: "orbit 14s linear infinite",
            },
          },
        },
      };
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-ink-50 text-ink-700 antialiased">
    <!-- Skip link -->
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:bg-brand-600 focus:text-white focus:px-3 focus:py-2 focus:rounded-lg">Skip to content</a>

    <!-- App shell -->
    <div id="app" class="min-h-screen flex flex-col"></div>

    <!-- Fallback loader if JS is disabled -->
    <noscript>
      <div style="padding:2rem;font-family:system-ui;text-align:center;color:#1E293B;">
        This prototype needs JavaScript enabled to run.
      </div>
    </noscript>

    <!-- Plain (non-module) scripts so the app works from file:// and any static server -->
    <script src="./data.js"></script>
    <script src="./components.js"></script>
    <script src="./pages/home.js"></script>
    <script src="./pages/dashboard.js"></script>
    <script src="./pages/agents.js"></script>
    <script src="./pages/about.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
